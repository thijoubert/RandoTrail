name: ci
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  BASE_PATH: /RandoTrail/

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Upload dist
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps webkit chromium
      - run: npm run build
      - name: E2E (WebKit iPhone 13 + Chromium), offline fixtures
        run: npx playwright test
      - name: "E2E real network (WebKit) - Overpass, IGN, Terrarium, Open-Meteo, IGN WMTS from a browser"
        if: always()
        env:
          REAL_NETWORK: '1'
        run: npx playwright test e2e/real-network.spec.ts --project=iphone-webkit || echo "real network test failed (see artifact)"
      - name: Upload screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots-and-results
          path: |
            e2e/screenshots
            e2e/results
            playwright-report
            test-results
          if-no-files-found: warn
  pages-enabled:
    # GitHub Pages must be enabled once by a repository admin (Settings > Pages > Source: GitHub Actions).
    # The GITHUB_TOKEN cannot create the Pages site itself ("Resource not accessible by integration").
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      enabled: ${{ steps.check.outputs.enabled }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh api "repos/${GITHUB_REPOSITORY}/pages" >/dev/null 2>&1; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          elif gh api -X POST "repos/${GITHUB_REPOSITORY}/pages" -f build_type=workflow >/dev/null 2>&1; then
            echo "Pages site created (build_type=workflow)"
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=GitHub Pages désactivé::Activez Pages (Settings > Pages > Build and deployment > Source: GitHub Actions). Sur un dépôt privé en plan gratuit, passez d'abord le dépôt en public."
          fi
  deploy:
    needs: [check, pages-enabled]
    if: needs.pages-enabled.outputs.enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - id: deployment
        uses: actions/deploy-pages@v4
