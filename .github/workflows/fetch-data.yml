name: fetch-data
# Fetches REAL Overpass / IGN / Open-Meteo data for Lyon centre and commits it into fixtures/.
# The development sandbox has no access to these hosts; GitHub Actions has.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/fetch-fixtures.mjs'
      - 'scripts/lib.mjs'
      - '.github/workflows/fetch-data.yml'

permissions:
  contents: write

concurrency:
  group: fetch-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch Overpass (Lyon centre + known stairs)
        run: node scripts/fetch-fixtures.mjs overpass
      - name: Fetch elevations (IGN RGE ALTI for all nodes, Open-Meteo sample)
        continue-on-error: true
        run: node scripts/fetch-fixtures.mjs elevation
      - name: Network probes (IGN WMTS no key, CORS headers, mirrors)
        continue-on-error: true
        run: node scripts/fetch-fixtures.mjs probes
      - name: Summary
        if: always()
        run: |
          ls -la fixtures
          cat fixtures/meta.json
          cat fixtures/network-probes.json | head -80
      - name: Upload fixtures artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fixtures
          path: fixtures/
      - name: Commit fixtures
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Base the data commit on the latest main (index = origin/main, working tree keeps the new data),
          # and add ONLY the data folders so that workflow files are never touched (GITHUB_TOKEN cannot).
          for i in 1 2 3 4; do
            git fetch origin main
            git reset -q origin/main
            git add -A fixtures
            if git diff --cached --quiet; then echo "nothing new"; break; fi
            git commit -q -m "data: refresh real Lyon fixtures (Overpass, IGN RGE ALTI, Open-Meteo, probes)"
            git push origin HEAD:main && break
            sleep 5
          done
